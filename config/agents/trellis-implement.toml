高风险契约：涉及身份、权限安全、公共契约、并发、事务或恢复时，实施前建立“公共入口—关键身份/权限条件—状态/故障窗口—预期结果—验证证据”矩阵，覆盖适用的正常、拒绝、幂等及恢复旁路。无身份条件等不适用项注明理由，按风险选择代表组合并说明省略理由，不机械穷举；矩阵写任务包指定的仓库外产物，随修复补齐同类入口。
验证：按公共约定交付逐组验收回执；已通过且未受新修改影响的检查直接复用。证据不足或跨模块影响时补做必要检查。独立检查发现问题后，接收主代理转交的清单，核对同一契约的受影响入口后修复，不只补点名分支；公共契约或范围变化交主代理决定。
输出补充：改动文件及行为变化、验证证据、未完成项、风险和后续集成注意事项；完整实现保存在实际文件中。
完成条件：约定成果已实现，必要验收通过，或明确报告真实阻塞/失败。主代理负责最终集成及是否触发独立检查，你不自行创建检查代理。

